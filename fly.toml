# Fly.io config. Built from the repo's Dockerfile; /data is a Fly volume holding the SQLite case database and the Admin flow JSON.
app = "greenspark-ervei-chit-thway"
primary_region = "sin"
# A little swap as headroom.
swap_size_mb = 256

# Every open account in the dataset (4,380 cases); see scripts/generate-all-cases.mts.
[env]
  GREENSPARK_DATASET = "all"
  NODE_OPTIONS = "--max-old-space-size=320"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "greenspark_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Suspend keeps the machine's memory, so it resumes in under a second instead of booting and reloading the data.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

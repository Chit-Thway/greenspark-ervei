<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="820" viewBox="0 0 1520 820" role="img" aria-labelledby="title description">
  <title id="title">GreenSpark Ervei — current architecture</title>
  <desc id="description">Customer data, environmental data, and economic data feed a prediction model owned by another teammate. Our team handles data and the first shared interface for managers and support workers. The interface receives support need, urgency and proposed supporting reasons, with category and urgency filters, Assigned to me, case assignment and bulk actions. Customer data was marked optional in the original sketch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#218064"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #517066; }
      .heading { font-size: 25px; font-weight: 700; fill: #173d30; }
      .body { font-size: 17px; fill: #4d625a; }
      .small { font-size: 14px; fill: #517066; }
      .connector { fill: none; stroke: #218064; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1520" height="820" rx="24" fill="#f4f8f6"/>
  <text x="56" y="63" class="eyebrow">GREENSPARK ERVEI / WORKING DESIGN</text>
  <text x="56" y="111" font-size="38" font-weight="700" fill="#173d30">From data to a support decision</text>
  <text x="56" y="145" font-size="19" fill="#517066">Customer, environmental and economic inputs feed the model, then the first shared staff interface.</text>

  <text x="56" y="200" class="eyebrow">01 / INPUTS + DATA HANDLING</text>
  <text x="620" y="200" class="eyebrow">02 / TEAMMATE'S MODEL</text>
  <text x="1110" y="200" class="eyebrow">03 / OUR FIRST INTERFACE</text>

  <g>
    <rect x="56" y="224" width="370" height="146" rx="18" fill="#ffffff" stroke="#cfddd5" stroke-width="1.5"/>
    <rect x="56" y="246" width="5" height="102" rx="2.5" fill="#48a985"/>
    <text x="82" y="268" class="heading">Customer data</text>
    <rect x="295" y="246" width="108" height="28" rx="14" fill="#edf5f0"/>
    <text x="349" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#517066">Optional in sketch</text>
    <text x="82" y="309" class="body">Account, billing and payment history</text>
    <text x="82" y="338" class="body">Usage and recorded customer context</text>
  </g>

  <g>
    <rect x="56" y="402" width="370" height="146" rx="18" fill="#ffffff" stroke="#cfddd5" stroke-width="1.5"/>
    <rect x="56" y="424" width="5" height="102" rx="2.5" fill="#48a985"/>
    <text x="82" y="446" class="heading">Environmental data</text>
    <text x="82" y="487" class="body">Weather and hazard forecasts</text>
    <text x="82" y="516" class="body">Event timing and area exposure</text>
  </g>

  <g>
    <rect x="56" y="580" width="370" height="146" rx="18" fill="#ffffff" stroke="#cfddd5" stroke-width="1.5"/>
    <rect x="56" y="602" width="5" height="102" rx="2.5" fill="#48a985"/>
    <text x="82" y="624" class="heading">Economic data</text>
    <text x="82" y="665" class="body">Economic indicators</text>
    <text x="82" y="694" class="body">Cost and affordability pressures</text>
  </g>

  <path d="M 426 297 H 518 V 653 H 426" class="connector"/>
  <path d="M 426 475 H 620" class="connector" marker-end="url(#arrow)"/>
  <circle cx="518" cy="475" r="6" fill="#218064"/>

  <g>
    <rect x="620" y="310" width="320" height="330" rx="22" fill="#173d30"/>
    <rect x="646" y="337" width="81" height="28" rx="14" fill="#315a48"/>
    <text x="686" y="356" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#c8edda">MODEL</text>
    <text x="646" y="407" font-size="29" font-weight="700" fill="#ffffff">Prediction model</text>
    <text x="646" y="451" font-size="17" fill="#d1e4d9">Combine available signals</text>
    <path d="M 646 475 H 914" stroke="#466a58"/>
    <text x="646" y="513" font-size="17" fill="#d1e4d9">Estimate need for support</text>
    <text x="646" y="542" font-size="17" fill="#d1e4d9">and urgency</text>
    <text x="646" y="594" font-size="15" fill="#a9d3ba">Owned by another teammate</text>
  </g>

  <path d="M 940 475 H 1110" class="connector" marker-end="url(#arrow)"/>
  <text x="1025" y="399" text-anchor="middle" class="small">Support need</text>
  <text x="1025" y="420" text-anchor="middle" class="small">+ urgency</text>
  <text x="1025" y="441" text-anchor="middle" class="small">+ reasons*</text>

  <g>
    <rect x="1110" y="310" width="354" height="330" rx="22" fill="#ffffff" stroke="#79b89a" stroke-width="2"/>
    <rect x="1136" y="337" width="194" height="28" rx="14" fill="#edf5f0"/>
    <text x="1233" y="356" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#517066">SHARED STAFF WORKSPACE</text>
    <text x="1136" y="407" font-size="29" font-weight="700" fill="#173d30">First interface</text>
    <text x="1136" y="451" class="body">Manager + support worker</text>
    <path d="M 1136 475 H 1438" stroke="#d8e5dc"/>
    <text x="1136" y="508" class="body">Category + urgency filters</text>
    <text x="1136" y="537" class="body">Assigned to me</text>
    <text x="1136" y="566" class="body">Case assignment + bulk actions</text>
    <text x="1136" y="608" font-size="15" fill="#218064">Staff review and decide next steps</text>
  </g>

  <text x="56" y="753" class="small">Our scope: data handling + the first interface</text>
  <text x="56" y="782" class="small">Working design • Example inputs • *Supporting reasons are proposed • Data fields and integration contracts are still being agreed</text>
  <text x="1464" y="782" text-anchor="end" class="small">16 OCT 2026</text>
</svg>
